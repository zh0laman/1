map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Внутренний nginx.conf проекта
server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # AlemAI endpoints (strip /api prefix, then proxy to 18002)
    location ~ ^/api/(ask|tools)(/.*)?$ {
        client_max_body_size 32m;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://172.17.0.1:18002;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Main API proxy with automatic v1 fallback for legacy modules (like Drive)
    location /api/ {
        # If request doesn't start with /api/v1/ or /api/ask or /api/tools, try to prepend /v1/
        # This fixes Drive module calling /api/auth/me instead of /api/v1/auth/me
        rewrite ^/api/(?!v1/|ask|tools)(.*)$ /api/v1/$1 last;

        proxy_pass http://172.17.0.1:18081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /web/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /web/index.html;
    }

    # Редирект для удобства
    location = / {
        return 301 /web/;
    }
}
