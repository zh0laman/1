<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alem RAG — Чат-бот</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #5B6EF5;
      --brand-light: #EEF0FF;
      --brand-dark: #4456d4;
      --bg: #F7F8FC;
      --surface: #FFFFFF;
      --border: #E5E7EB;
      --text: #1F2937;
      --muted: #6B7280;
      --danger: #EF4444;
      --success: #10B981;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }

    /* ── SIDEBAR ────────────────────────────────────────────────────────── */
    .sidebar {
      width: 300px; min-width: 300px; background: var(--surface);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }
    .sidebar-header {
      padding: 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--brand); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .sidebar-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .sidebar-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .sidebar-section { padding: 16px; border-bottom: 1px solid var(--border); }
    .section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }

    .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .input-group label { font-size: 12px; color: var(--muted); }
    .input-group input, .input-group textarea {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
      font-size: 13px; font-family: inherit; background: var(--bg);
      transition: border-color .2s;
    }
    .input-group input:focus, .input-group textarea:focus { outline: none; border-color: var(--brand); }

    .btn {
      padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 500; transition: opacity .15s, background .15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { opacity: .88; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--brand); color: var(--brand); }
    .btn-danger  { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .status-dot.ok { background: var(--success); }
    .status-dot.err { background: var(--danger); }

    /* ── DOCS LIST ──────────────────────────────────────────────────────── */
    .docs-list { flex: 1; overflow-y: auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 6px; }
    .doc-item {
      background: var(--bg); border-radius: 8px; padding: 8px 10px;
      display: flex; justify-content: space-between; align-items: center;
      border: 1px solid var(--border);
    }
    .doc-name { font-size: 12px; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .doc-status { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    .doc-status.ready { background: #D1FAE5; color: #065F46; }
    .doc-status.processing { background: #FEF3C7; color: #92400E; }
    .doc-status.error { background: #FEE2E2; color: #991B1B; }

    .upload-zone {
      margin: 0 16px 16px; border: 2px dashed var(--border); border-radius: 10px;
      padding: 14px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s;
    }
    .upload-zone:hover, .upload-zone.drag { border-color: var(--brand); background: var(--brand-light); }
    .upload-zone-text { font-size: 12px; color: var(--muted); }
    .upload-zone-hint { font-size: 11px; color: var(--muted); margin-top: 4px; opacity: .7; }

    /* ── CHAT AREA ──────────────────────────────────────────────────────── */
    .chat-area { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .chat-header {
      padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .chat-bot-info { display: flex; align-items: center; gap: 10px; }
    .chat-bot-avatar { width: 38px; height: 38px; border-radius: 10px; background: var(--brand); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .chat-bot-name { font-size: 15px; font-weight: 600; }
    .chat-bot-status { font-size: 11px; display: flex; align-items: center; gap: 4px; }

    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    .message { display: flex; gap: 10px; align-items: flex-start; }
    .message.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
    }
    .message.bot .msg-avatar { background: var(--brand); color: #fff; }
    .message.user .msg-avatar { background: #E5E7EB; color: #374151; }
    .msg-bubble {
      max-width: 70%; padding: 10px 14px; border-radius: 4px 14px 14px 14px;
      font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    }
    .message.user .msg-bubble { border-radius: 14px 4px 14px 14px; background: #F3F4F6; }
    .message.bot .msg-bubble { background: var(--brand-light); color: var(--text); }
    .msg-sources { margin-top: 8px; }
    .source-chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; padding: 2px 7px; border-radius: 4px;
      background: rgba(91,110,245,.12); color: var(--brand);
      margin: 2px 3px 0 0; cursor: default;
    }

    .typing { display: inline-flex; gap: 4px; padding: 2px 0; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--brand);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }

    .chat-input-area {
      padding: 14px 20px; background: var(--surface); border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: flex-end;
    }
    .chat-input {
      flex: 1; resize: none; padding: 10px 14px; border-radius: 12px;
      border: 1px solid var(--border); font-size: 14px; line-height: 1.5;
      font-family: inherit; background: var(--bg); max-height: 120px; overflow-y: auto;
      transition: border-color .2s;
    }
    .chat-input:focus { outline: none; border-color: var(--brand); }
    .send-btn {
      width: 42px; height: 42px; border-radius: 10px; border: none;
      background: var(--brand); color: #fff; font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background .15s;
    }
    .send-btn:hover { background: var(--brand-dark); }
    .send-btn:disabled { background: #E5E7EB; cursor: not-allowed; }

    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--muted); }
    .empty-icon { font-size: 48px; opacity: .4; }
    .empty-text { font-size: 15px; font-weight: 500; }
    .empty-sub { font-size: 13px; opacity: .7; text-align: center; max-width: 300px; }

    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: #1F2937; color: #fff; padding: 10px 16px;
      border-radius: 10px; font-size: 13px; z-index: 9999;
      animation: fadeIn .2s ease; pointer-events: none;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .loader { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 3px; }
  </style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">🤖</div>
    <div>
      <div class="sidebar-title">Alem RAG</div>
      <div class="sidebar-sub">Многопользовательская платформа</div>
    </div>
  </div>

  <!-- Auth Section -->
  <div class="sidebar-section" id="auth-section">
    <div class="section-label">Авторизация</div>
    <div class="input-group">
      <label>Email</label>
      <input id="email" type="email" placeholder="admin@example.com" />
    </div>
    <div class="input-group">
      <label>Пароль</label>
      <input id="password" type="password" placeholder="••••••••" />
    </div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn btn-primary btn-sm" onclick="login()" id="login-btn">Войти</button>
      <button class="btn btn-outline btn-sm" onclick="register()" id="reg-btn">Зарегистрировать</button>
    </div>
    <div id="auth-status" style="font-size:11px;margin-top:8px;color:var(--muted)"></div>
  </div>

  <!-- Bot Section (shown after login) -->
  <div class="sidebar-section" id="bot-section" style="display:none">
    <div class="section-label">Чат-бот</div>
    <div class="input-group">
      <label>API Ключ бота</label>
      <input id="bot-api-key" type="text" placeholder="rag_xxxxx..." oninput="onApiKeyChange()" />
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-outline btn-sm" onclick="loadBots()">📋 Мои боты</button>
      <button class="btn btn-primary btn-sm" onclick="showCreateBot()">+ Создать бота</button>
    </div>
    <div id="bots-list" style="margin-top:10px;display:flex;flex-direction:column;gap:6px"></div>
  </div>

  <!-- Create Bot Form -->
  <div class="sidebar-section" id="create-bot-section" style="display:none">
    <div class="section-label">Новый бот</div>
    <div class="input-group">
      <label>Название</label>
      <input id="new-bot-name" placeholder="Мой ассистент" />
    </div>
    <div class="input-group">
      <label>System Prompt (необязательно)</label>
      <textarea id="new-bot-prompt" rows="3" placeholder="Ты помощник по документам компании..."></textarea>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary btn-sm" onclick="createBot()">Создать</button>
      <button class="btn btn-outline btn-sm" onclick="hideCreateBot()">Отмена</button>
    </div>
  </div>

  <!-- Docs Section -->
  <div class="docs-list" id="docs-list" style="display:none">
    <div class="section-label" style="padding:0 0 4px 0">📚 База знаний</div>
    <div id="docs-items"></div>
  </div>

  <div class="upload-zone" id="upload-zone" style="display:none"
       onclick="document.getElementById('file-input').click()"
       ondragover="event.preventDefault();this.classList.add('drag')"
       ondragleave="this.classList.remove('drag')"
       ondrop="handleDrop(event)">
    <div class="upload-zone-text">📎 Загрузить документ</div>
    <div class="upload-zone-hint">PDF, DOCX, XLSX, PPTX, TXT, MD, HTML</div>
    <input type="file" id="file-input" style="display:none" accept=".pdf,.docx,.xlsx,.pptx,.txt,.md,.html,.csv" onchange="uploadDoc(this.files[0])" />
  </div>
</aside>

<!-- ── CHAT AREA ── -->
<main class="chat-area">
  <div class="chat-header">
    <div class="chat-bot-info">
      <div class="chat-bot-avatar">💬</div>
      <div>
        <div class="chat-bot-name" id="chat-title">Выберите бота</div>
        <div class="chat-bot-status">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Не подключён</span>
        </div>
      </div>
    </div>
    <button class="btn btn-outline btn-sm" onclick="clearChat()" id="clear-btn" style="display:none">🗑 Очистить</button>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state">
      <div class="empty-icon">🤖</div>
      <div class="empty-text">Alem RAG Чат-бот</div>
      <div class="empty-sub">Авторизуйтесь, выберите бота и введите API ключ чтобы начать общение</div>
    </div>
  </div>

  <div class="chat-input-area">
    <textarea
      class="chat-input"
      id="chat-input"
      placeholder="Задайте вопрос по документам... (Enter — отправить)"
      rows="1"
      oninput="autoResize(this)"
      onkeydown="handleKey(event)"
      disabled
    ></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>▶</button>
  </div>
</main>

<script>
const API = 'http://localhost:8000';
let JWT = localStorage.getItem('jwt') || '';
let BOT_KEY = localStorage.getItem('bot_api_key') || '';
let currentBotId = localStorage.getItem('bot_id') || '';
let messages = [];
let uploading = false;

// ── Init ───────────────────────────────────────────────────────────────────
window.onload = () => {
  if (JWT) {
    document.getElementById('bot-section').style.display = 'block';
    document.getElementById('auth-section').style.display = 'none';
  }
  if (BOT_KEY) {
    document.getElementById('bot-api-key').value = BOT_KEY;
    activateChat(BOT_KEY);
  }
};

// ── Toast ──────────────────────────────────────────────────────────────────
function toast(msg, dur = 3000) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), dur);
}

// ── Auth ───────────────────────────────────────────────────────────────────
async function login() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  if (!email || !pass) return toast('Заполните email и пароль');
  const btn = document.getElementById('login-btn');
  btn.innerHTML = '<span class="loader"></span>';
  btn.disabled = true;
  try {
    const r = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password: pass})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Ошибка входа');
    JWT = d.access_token;
    localStorage.setItem('jwt', JWT);
    document.getElementById('auth-section').style.display = 'none';
    document.getElementById('bot-section').style.display = 'block';
    toast('✅ Вход выполнен');
    loadBots();
  } catch(e) {
    toast('❌ ' + e.message);
  } finally {
    btn.innerHTML = 'Войти';
    btn.disabled = false;
  }
}

async function register() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  const name = prompt('Ваше имя:') || 'Пользователь';
  const tenant = prompt('Название организации:') || 'Моя компания';
  if (!email || !pass) return toast('Заполните email и пароль');
  const btn = document.getElementById('reg-btn');
  btn.disabled = true;
  try {
    const r = await fetch(`${API}/auth/register`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password: pass, full_name: name, tenant_name: tenant})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Ошибка регистрации');
    JWT = d.access_token;
    localStorage.setItem('jwt', JWT);
    document.getElementById('auth-section').style.display = 'none';
    document.getElementById('bot-section').style.display = 'block';
    toast('✅ Регистрация выполнена');
    loadBots();
  } catch(e) {
    toast('❌ ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

// ── Bots ───────────────────────────────────────────────────────────────────
async function loadBots() {
  if (!JWT) return;
  try {
    const r = await fetch(`${API}/admin/bots`, { headers: {'Authorization': `Bearer ${JWT}`} });
    const bots = await r.json();
    const el = document.getElementById('bots-list');
    if (!bots.length) {
      el.innerHTML = '<div style="font-size:11px;color:var(--muted)">Ботов нет. Создайте первого!</div>';
      return;
    }
    el.innerHTML = bots.map(b => `
      <div style="background:var(--bg);border-radius:8px;padding:8px 10px;border:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:12px;font-weight:600">${b.name}</span>
          <span style="width:8px;height:8px;border-radius:50%;background:${b.is_active?'var(--success)':'#D1D5DB'};flex-shrink:0"></span>
        </div>
        <div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">
          <button class="btn btn-outline btn-sm" onclick="selectBot('${b.id}','${b.name}')">💬 Чат</button>
          <button class="btn btn-outline btn-sm" onclick="genApiKey('${b.id}')">🔑 API ключ</button>
          <button class="btn btn-danger btn-sm" onclick="deleteBot('${b.id}')">🗑</button>
        </div>
      </div>
    `).join('');
  } catch(e) {
    toast('❌ Ошибка загрузки ботов');
  }
}

function showCreateBot() {
  document.getElementById('create-bot-section').style.display = 'block';
}
function hideCreateBot() {
  document.getElementById('create-bot-section').style.display = 'none';
}

async function createBot() {
  const name = document.getElementById('new-bot-name').value.trim();
  const prompt = document.getElementById('new-bot-prompt').value.trim();
  if (!name) return toast('Введите название бота');
  try {
    const r = await fetch(`${API}/admin/bots`, {
      method: 'POST',
      headers: {'Authorization': `Bearer ${JWT}`, 'Content-Type':'application/json'},
      body: JSON.stringify({name, system_prompt: prompt || null, settings: {}})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail);
    hideCreateBot();
    document.getElementById('new-bot-name').value = '';
    document.getElementById('new-bot-prompt').value = '';
    toast('✅ Бот создан');
    loadBots();
  } catch(e) {
    toast('❌ ' + e.message);
  }
}

async function deleteBot(id) {
  if (!confirm('Удалить бота и все его документы?')) return;
  try {
    await fetch(`${API}/admin/bots/${id}`, {
      method: 'DELETE', headers: {'Authorization': `Bearer ${JWT}`}
    });
    toast('Бот удалён');
    loadBots();
    if (currentBotId === id) deactivateChat();
  } catch(e) { toast('❌ Ошибка'); }
}

async function genApiKey(botId) {
  try {
    const r = await fetch(`${API}/admin/bots/${botId}/api-key`, {
      method: 'POST', headers: {'Authorization': `Bearer ${JWT}`}
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail);
    const key = d.api_key;
    document.getElementById('bot-api-key').value = key;
    BOT_KEY = key;
    localStorage.setItem('bot_api_key', key);
    toast('✅ API ключ создан: ' + key.substring(0,20) + '...');
    selectBot(botId, '');
  } catch(e) {
    toast('❌ ' + e.message);
  }
}

async function selectBot(botId, botName) {
  currentBotId = botId;
  localStorage.setItem('bot_id', botId);
  document.getElementById('chat-title').textContent = botName || 'Бот';
  if (BOT_KEY) activateChat(BOT_KEY);
  loadDocs(botId);
}

// ── Chat activation ────────────────────────────────────────────────────────
function onApiKeyChange() {
  BOT_KEY = document.getElementById('bot-api-key').value.trim();
  localStorage.setItem('bot_api_key', BOT_KEY);
  if (BOT_KEY) activateChat(BOT_KEY);
}

function activateChat(key) {
  document.getElementById('chat-input').disabled = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('status-dot').className = 'status-dot ok';
  document.getElementById('status-text').textContent = 'Готов к ответу';
  document.getElementById('clear-btn').style.display = 'block';
  if (currentBotId) {
    document.getElementById('docs-list').style.display = 'block';
    document.getElementById('upload-zone').style.display = 'block';
    loadDocs(currentBotId);
  }
  // Show welcome if no messages
  if (!messages.length) {
    addMessage('bot', '👋 Привет! Я готов отвечать на вопросы по загруженным документам. Загрузите файлы через панель слева.');
  }
}

function deactivateChat() {
  currentBotId = '';
  document.getElementById('chat-input').disabled = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('status-dot').className = 'status-dot';
  document.getElementById('status-text').textContent = 'Не подключён';
}

// ── Documents ──────────────────────────────────────────────────────────────
async function loadDocs(botId) {
  if (!JWT || !botId) return;
  try {
    const r = await fetch(`${API}/admin/bots/${botId}/documents`, {
      headers: {'Authorization': `Bearer ${JWT}`}
    });
    const d = await r.json();
    const docs = d.items || [];
    const el = document.getElementById('docs-items');
    if (!docs.length) {
      el.innerHTML = '<div style="font-size:11px;color:var(--muted);padding:4px 0">Документов нет</div>';
      return;
    }
    el.innerHTML = docs.map(doc => `
      <div class="doc-item">
        <div style="flex:1;overflow:hidden">
          <div class="doc-name">📄 ${doc.filename}</div>
          <div class="doc-meta">${doc.chunk_count} фрагментов</div>
        </div>
        <span class="doc-status ${doc.status}">${statusLabel(doc.status)}</span>
        <button onclick="deleteDoc('${botId}','${doc.id}')" style="margin-left:6px;background:none;border:none;cursor:pointer;color:var(--danger);font-size:14px;line-height:1">×</button>
      </div>
    `).join('');
  } catch(e) {}
}

function statusLabel(s) {
  return {ready:'✓ Готов', processing:'⏳', pending:'⏳', error:'✗ Ошибка'}[s] || s;
}

async function uploadDoc(file) {
  if (!file || !currentBotId || !JWT) return;
  uploading = true;
  document.querySelector('.upload-zone-text').textContent = '⏳ Загружаем...';
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch(`${API}/admin/bots/${currentBotId}/documents`, {
      method: 'POST',
      headers: {'Authorization': `Bearer ${JWT}`},
      body: fd
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail);
    toast(`✅ Загружено: ${file.name} (${d.chunk_count} фрагментов)`);
    loadDocs(currentBotId);
  } catch(e) {
    toast('❌ ' + e.message);
  } finally {
    uploading = false;
    document.querySelector('.upload-zone-text').textContent = '📎 Загрузить документ';
    document.getElementById('file-input').value = '';
  }
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('upload-zone').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file) uploadDoc(file);
}

async function deleteDoc(botId, docId) {
  if (!confirm('Удалить документ?')) return;
  await fetch(`${API}/admin/bots/${botId}/documents/${docId}`, {
    method: 'DELETE', headers: {'Authorization': `Bearer ${JWT}`}
  });
  toast('Документ удалён');
  loadDocs(botId);
}

// ── Chat ───────────────────────────────────────────────────────────────────
function addMessage(role, text, sources) {
  const msg = { role, content: text, sources };
  messages.push(msg);
  renderMessages();
  return messages.length - 1;
}

function renderMessages() {
  const el = document.getElementById('messages');
  if (!messages.length) return;
  el.innerHTML = messages.map((m, i) => {
    const isBot = m.role === 'bot';
    const avatar = isBot ? 'AI' : 'Я';
    let bubble = m.pending
      ? `<div class="typing"><span></span><span></span><span></span></div>`
      : (m.content || '');

    let sourcesHtml = '';
    if (m.sources && m.sources.length) {
      sourcesHtml = `<div class="msg-sources">${m.sources.map(s =>
        `<span class="source-chip">📄 ${s.filename}${s.page_number ? ' p.' + s.page_number : ''} <span style="opacity:.6">${(s.similarity*100).toFixed(0)}%</span></span>`
      ).join('')}</div>`;
    }

    return `
      <div class="message ${isBot ? 'bot' : 'user'}">
        <div class="msg-avatar">${avatar}</div>
        <div>
          <div class="msg-bubble">${escHtml(bubble)}${m.pending ? '' : ''}</div>
          ${sourcesHtml}
        </div>
      </div>
    `;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

// Для стримингового обновления последнего сообщения
function updateLastMessage(text, sources) {
  if (!messages.length) return;
  const last = messages[messages.length - 1];
  last.content = text;
  last.pending = false;
  if (sources) last.sources = sources;
  renderMessages();
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !BOT_KEY || !currentBotId) return;

  addMessage('user', text);
  input.value = '';
  input.style.height = 'auto';

  // Pending bot message
  const history = messages
    .filter(m => !m.pending)
    .slice(0, -1)
    .map(m => ({ role: m.role === 'bot' ? 'assistant' : 'user', content: m.content }));

  messages.push({ role: 'bot', content: '', pending: true });
  renderMessages();

  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  input.disabled = true;

  try {
    const r = await fetch(`${API}/chat/${currentBotId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': BOT_KEY },
      body: JSON.stringify({ message: text, history, top_k: 5, stream: true })
    });

    if (!r.ok) {
      const err = await r.json().catch(() => ({ detail: r.statusText }));
      throw new Error(err.detail || 'API error');
    }

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let answer = '';
    let sources = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (raw === '[DONE]') break;
        try {
          const chunk = JSON.parse(raw);
          if (chunk.type === 'sources') sources = chunk.sources || [];
          if (chunk.type === 'delta') { answer += chunk.delta; updateLastMessage(answer, sources); }
          if (chunk.type === 'error') throw new Error(chunk.error);
        } catch(e) {}
      }
    }
    if (!answer) throw new Error('Пустой ответ от сервера');

  } catch(e) {
    updateLastMessage('⚠️ Ошибка: ' + e.message, []);
  } finally {
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

function clearChat() {
  messages = [];
  document.getElementById('messages').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">💬</div>
      <div class="empty-text">Чат очищен</div>
      <div class="empty-sub">Задайте новый вопрос</div>
    </div>
  `;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
</script>
